name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          for file in bin/simlease install.sh test/run.sh test/stub/xcrun; do
            bash -n "$file"
            /bin/bash -n "$file"
          done
      - name: Tests (macOS /bin/bash 3.2)
        run: test/run.sh /bin/bash
      - name: Tests (bash 5)
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          test/run.sh "$(brew --prefix)/bin/bash"
      - name: Lifecycle ownership checks
        run: python3 test/test_lifecycle_mutation.py
