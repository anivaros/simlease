name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash 5
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Syntax
        run: bash -n bin/simlease install.sh test/run.sh test/stub/xcrun
      - name: Tests
        run: test/run.sh
      - name: Lifecycle ownership checks
        run: python3 test/test_lifecycle_mutation.py
